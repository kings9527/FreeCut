name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install numpy Pillow PySide6 av opencv-python-headless
          pip install ruff

      - name: 静态检查
        run: ruff check freecut

      - name: 单元测试（不依赖 ffmpeg 的子集）
        env:
          QT_QPA_PLATFORM: offscreen
          FREECUT_NO_AUDIO: "1"
        run: |
          python -m unittest tests.test_inspector_layout tests.test_transition_registry tests.test_transition_aliases tests.test_unsaved_close tests.test_recent_projects -v
